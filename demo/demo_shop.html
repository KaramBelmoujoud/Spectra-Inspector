<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spectra Demo Store</title>
<style>
  :root { --ink:#1d2230; --muted:#6b7280; --line:#e5e7eb; --brand:#4f46e5; --bg:#f6f7fb; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:18px; padding:12px 22px; background:#fff; border-bottom:1px solid var(--line); }
  .logo { font-weight:700; font-size:20px; } .logo span { color:var(--brand); }
  nav a { color:var(--ink); text-decoration:none; margin-right:14px; }
  nav a:hover { color:var(--brand); }
  .search { margin-left:auto; display:flex; gap:6px; }
  input, select { font:inherit; padding:7px 10px; border:1px solid #cfd4dc; border-radius:8px; background:#fff; }
  button { font:inherit; padding:7px 14px; border:0; border-radius:8px; background:var(--brand); color:#fff; cursor:pointer; }
  button.ghost { background:#eef0f4; color:var(--ink); }
  #cart { font-weight:600; }
  main { display:grid; grid-template-columns: 1fr 300px; gap:18px; padding:18px 22px; }
  h2 { margin:4px 0 10px; font-size:17px; }
  .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:10px; color:var(--muted); }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .card .img { height:62px; border-radius:8px; margin-bottom:8px; }
  .card h3 { margin:0; font-size:15px; } .price { color:var(--muted); margin:2px 0 8px; }
  aside .box { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  aside label { display:block; font-size:13px; color:var(--muted); margin-top:8px; }
  aside input[type=email], aside input[type=password] { width:100%; }
  .row { display:flex; align-items:center; gap:6px; margin:10px 0; color:var(--ink); }
  #login-msg, #search-msg { color:#0a7a3d; font-weight:600; min-height:20px; margin-top:6px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:14px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); font-size:14px; }
  th { background:#f1f3f8; }
  iframe { width:100%; height:128px; border:1px solid var(--line); border-radius:12px; background:#fff; }
  @media (max-width: 1000px) {
    header { flex-wrap: wrap; gap: 10px 16px; }
    main { grid-template-columns: 1fr 250px; padding: 14px; gap: 14px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card .img { height: 34px; }
    .card { padding: 10px; }
    aside .box { padding: 10px 12px; margin-bottom: 10px; }
    aside h2 { margin: 0 0 4px; }
    table { display: none; }
    iframe { height: 112px; }
  }
  #toast { position:fixed; right:18px; bottom:18px; background:#1d2230; color:#fff; padding:10px 14px; border-radius:10px; opacity:0; transition:opacity .2s; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <div class="logo">Spectra<span>Store</span></div>
  <nav aria-label="Main">
    <a href="#home">Home</a><a href="#products">Products</a><a href="#deals">Deals</a><a href="#contact">Contact</a>
  </nav>
  <form class="search" onsubmit="doSearch(event)">
    <input id="search" name="q" type="search" placeholder="Search products" aria-label="Search products">
    <button id="search-btn" type="submit">Search</button>
  </form>
  <span id="cart" aria-live="polite">Cart (0)</span>
</header>

<main>
  <section id="products">
    <div class="toolbar">
      <h2 style="margin:0">Products</h2>
      <span id="search-msg"></span>
      <label style="margin-left:auto">Sort by
        <select id="sort" aria-label="Sort by">
          <option>Featured</option><option>Price: low to high</option><option>Price: high to low</option><option>Newest</option>
        </select>
      </label>
    </div>
    <div class="grid" id="grid"></div>
    <iframe style="margin-top:12px" id="newsletter" title="Newsletter" srcdoc='
      <style>body{font:14px "Segoe UI",sans-serif;margin:10px;color:#1d2230} input,button{font:inherit;padding:6px 9px;border-radius:7px}
      input{border:1px solid #cfd4dc;width:62%} button{border:0;background:#2f6fed;color:#fff} #ok{color:#0a7a3d;font-weight:600;margin-top:6px}</style>
      <b>Newsletter</b><p style="margin:4px 0 8px">Weekly deals, no spam.</p>
      <input id="nl-email" type="email" placeholder="Email address" aria-label="Newsletter email">
      <button id="subscribe" onclick="document.getElementById(&apos;ok&apos;).textContent=&apos;Subscribed!&apos;">Subscribe</button>
      <div id="ok"></div>'></iframe>

    <table aria-label="Recent orders">
      <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th></tr></thead>
      <tbody>
        <tr><td>#1042</td><td>Ada Lovelace</td><td>Shipped</td><td>$129.00</td></tr>
        <tr><td>#1043</td><td>Alan Turing</td><td>Processing</td><td>$58.50</td></tr>
        <tr><td>#1044</td><td>Grace Hopper</td><td>Delivered</td><td>$212.40</td></tr>
      </tbody>
    </table>
  </section>

  <aside>
    <div class="box">
      <h2>Sign in</h2>
      <form id="login" onsubmit="doLogin(event)">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••">
        <div class="row"><input id="remember" type="checkbox"><label for="remember" style="margin:0;color:inherit">Remember me</label></div>
        <button id="login-btn" type="submit">Sign in</button>
        <div id="login-msg"></div>
      </form>
    </div>
    <promo-dialog></promo-dialog>

  </aside>
</main>
<div id="toast"></div>

<script>
const products = [
  ["Aurora Headphones", 129, "#ffd6cc"], ["Nimbus Keyboard", 89, "#d6e4ff"], ["Comet Mouse", 49, "#d9f7e6"],
  ["Orbit Speaker", 159, "#fff1c2"], ["Pulse Smartwatch", 199, "#eadcff"], ["Halo Webcam", 79, "#ccf1f6"]];
let cart = 0;
const grid = document.getElementById("grid");
products.forEach(([name, price, color], i) => {
  const c = document.createElement("article");
  c.className = "card";
  c.innerHTML = `<div class="img" style="background:${color}"></div><h3>${name}</h3>
    <div class="price">$${price}.00</div><button class="add" type="button">Add to cart</button>`;
  c.querySelector("button").onclick = () => { cart++; document.getElementById("cart").textContent = `Cart (${cart})`; toast(`${name} added to cart`); };
  grid.appendChild(c);
});
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200); }
function doLogin(e) { e.preventDefault(); const v = document.getElementById("email").value || "guest"; document.getElementById("login-msg").textContent = `Welcome back, ${v}!`; }
function doSearch(e) { e.preventDefault(); const q = document.getElementById("search").value; document.getElementById("search-msg").textContent = q ? `Results for "${q}"` : ""; }

class PromoDialog extends HTMLElement {
  constructor() {
    super();
    const root = this.attachShadow({ mode: "open" });
    root.innerHTML = `<style>
      .dlg{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:14px}
      h2{margin:0 0 6px;font:600 16px "Segoe UI",sans-serif} p{margin:0 0 8px;color:#6b7280;font:14px "Segoe UI",sans-serif}
      input{font:14px "Segoe UI",sans-serif;padding:7px 9px;border:1px solid #cfd4dc;border-radius:8px;width:56%}
      button{font:14px "Segoe UI",sans-serif;padding:7px 12px;border:0;border-radius:8px;background:#0a7a3d;color:#fff}
      #msg{color:#0a7a3d;font:600 13px "Segoe UI",sans-serif;margin-top:6px;min-height:18px}</style>
      <div class="dlg" role="dialog" aria-label="Member offer"><h2>Members get 10% off</h2>
      <p>Shadow DOM component</p><input id="coupon" placeholder="Coupon code" aria-label="Coupon code">
      <button id="apply">Apply coupon</button><div id="msg"></div></div>`;
    root.getElementById("apply").onclick = () => root.getElementById("msg").textContent = "Coupon applied";
  }
}
customElements.define("promo-dialog", PromoDialog);
</script>
</body>
</html>
